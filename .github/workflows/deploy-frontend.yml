name: Deploy Frontend

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Deploy ${{ inputs.environment }} Frontend
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Fetch Entra ID Configuration
        run: |
          APP_SETTINGS=$(az staticwebapp appsettings list --name swa-mdms-${{ inputs.environment }} --query "properties" -o json)
          echo "NEXT_PUBLIC_ENTRA_CLIENT_ID=$(echo $APP_SETTINGS | jq -r '.NEXT_PUBLIC_ENTRA_CLIENT_ID')" >> $GITHUB_ENV
          echo "NEXT_PUBLIC_ENTRA_AUTHORITY=$(echo $APP_SETTINGS | jq -r '.NEXT_PUBLIC_ENTRA_AUTHORITY')" >> $GITHUB_ENV

      - name: Fetch Redirect URI
        run: |
          HOSTNAME=$(az staticwebapp show --name swa-mdms-${{ inputs.environment }} --query "defaultHostname" -o tsv)
          echo "NEXT_PUBLIC_ENTRA_REDIRECT_URI=https://$HOSTNAME" >> $GITHUB_ENV

      - name: Get Deployment Token
        id: get-token
        run: |
          TOKEN=$(az keyvault secret show --vault-name kv-mahdaviadms-${{ inputs.environment }} --name swa-deployment-token --query value -o tsv)
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> $GITHUB_OUTPUT

      - name: Build
        run: npm run build

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ steps.get-token.outputs.token }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: frontend/out
          skip_app_build: true
